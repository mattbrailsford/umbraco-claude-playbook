<!doctype html>
<!--
  Media card view starter: a collection shown as a grid of uui-card-media, the way the Media
  section shows folders, images and files. Shows: section tab, folder tree, collection toolbar
  with the view switcher on grid, folder / image / file cards, a selected card and the bulk
  action bar. Thumbnails are inline SVG placeholders, so the file needs no image downloads.
  Delete what the screen doesn't use.
-->
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Mockup: Media cards</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@umbraco-ui/uui@2/dist/themes/light.css">
	<link rel="stylesheet" href="_mockup.css">
	<script type="module" src="_mockup.js"></script>
</head>
<body class="uui-font uui-text">
	<header class="app-header">
		<span class="logo">Umbraco</span>
		<uui-tab-group class="sections">
			<uui-tab label="Content">Content</uui-tab>
			<uui-tab label="Media" active>Media</uui-tab>
			<uui-tab label="Settings">Settings</uui-tab>
			<uui-tab label="Users">Users</uui-tab>
		</uui-tab-group>
		<div class="apps">
			<uui-button look="primary" compact label="Search"><uui-icon name="icon-search"></uui-icon></uui-button>
			<uui-button look="primary" compact label="Help"><uui-icon name="icon-help-alt"></uui-icon></uui-button>
			<uui-button look="primary" compact label="User"><uui-avatar name="Matt Brailsford"></uui-avatar></uui-button>
		</div>
	</header>

	<div class="section">
		<nav class="section-sidebar">
			<h3>Media</h3>
			<uui-menu-item label="Campaigns" has-children show-children>
				<uui-icon slot="icon" name="icon-folder"></uui-icon>
				<uui-menu-item label="Spring 2026" active><uui-icon slot="icon" name="icon-folder"></uui-icon></uui-menu-item>
				<uui-menu-item label="Autumn 2026"><uui-icon slot="icon" name="icon-folder"></uui-icon></uui-menu-item>
			</uui-menu-item>
			<uui-menu-item label="Products" has-children><uui-icon slot="icon" name="icon-folder"></uui-icon></uui-menu-item>
		</nav>

		<main class="section-main">
			<div class="body-layout">
				<div class="header">
					<div class="header-content workspace-header">
						<uui-button compact class="back" label="Back"><uui-icon name="icon-arrow-left"></uui-icon></uui-button>
						<uui-icon class="entity-icon" name="icon-folder"></uui-icon>
						<uui-input class="name" label="Name" value="Spring 2026"></uui-input>
					</div>
				</div>

				<div class="main">
					<!-- Replace from here: the collection being designed. -->
					<div class="collection">
						<div class="collection-toolbar">
							<uui-button look="outline" label="Create">Create</uui-button>
							<uui-input placeholder="Filter" label="Filter">
								<uui-icon slot="prepend" name="icon-search" style="margin-left:9px"></uui-icon>
							</uui-input>
							<uui-button compact label="Grid view"><uui-icon name="icon-grid"></uui-icon></uui-button>
						</div>

						<div class="media-grid">
							<uui-card-media name="Social banners" selectable></uui-card-media>
								<uui-card-media name="Spring campaign hero.jpg" selectable selected>
									<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'%3E%3Cdefs%3E%3ClinearGradient id='s' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%239cc9f0'/%3E%3Cstop offset='1' stop-color='%23e7f2fb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='400' height='300' fill='url%28%23s%29'/%3E%3Cpath d='M0 220 L120 140 L210 200 L290 130 L400 210 L400 300 L0 300Z' fill='%234f7a5a'/%3E%3C/svg%3E" alt="">
								</uui-card-media>
								<uui-card-media name="Team photo 2026.jpg" selectable>
									<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'%3E%3Cdefs%3E%3ClinearGradient id='s' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23f6c9a8'/%3E%3Cstop offset='1' stop-color='%23fbe9dc'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='400' height='300' fill='url%28%23s%29'/%3E%3Cpath d='M0 220 L120 140 L210 200 L290 130 L400 210 L400 300 L0 300Z' fill='%238a5a44'/%3E%3C/svg%3E" alt="">
								</uui-card-media>
								<uui-card-media name="Product shot with a much longer file name.png" selectable>
									<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'%3E%3Cdefs%3E%3ClinearGradient id='s' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23c9c3ef'/%3E%3Cstop offset='1' stop-color='%23eeeafb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='400' height='300' fill='url%28%23s%29'/%3E%3Cpath d='M0 220 L120 140 L210 200 L290 130 L400 210 L400 300 L0 300Z' fill='%235b5491'/%3E%3C/svg%3E" alt="">
								</uui-card-media>
								<uui-card-media name="Store front.jpg" selectable>
									<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'%3E%3Cdefs%3E%3ClinearGradient id='s' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23a8e0d2'/%3E%3Cstop offset='1' stop-color='%23e3f6f1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='400' height='300' fill='url%28%23s%29'/%3E%3Cpath d='M0 220 L120 140 L210 200 L290 130 L400 210 L400 300 L0 300Z' fill='%232f6f60'/%3E%3C/svg%3E" alt="">
								</uui-card-media>
							<uui-card-media name="Press release.pdf" file-ext="pdf" selectable></uui-card-media>
							<uui-card-media name="Price list.xlsx" file-ext="xlsx" selectable></uui-card-media>
						</div>
					</div>
					<!-- Replace to here. -->
				</div>

				<!-- Bulk action bar: only while cards are selected. -->
				<div class="bulk-bar">
					<div>
						<uui-button look="secondary" label="Clear selection">Clear selection</uui-button>
						<span>1 of 7 selected</span>
					</div>
					<div>
						<uui-button look="secondary" label="Move to">Move to…</uui-button>
						<uui-button look="secondary" color="danger" label="Trash">Trash</uui-button>
					</div>
				</div>
			</div>
		</main>
	</div>
</body>
</html>
